controls:
  logLevel: silly
  logFilename: "/var/log/cloud/bigIpRuntimeInit.log"
runtime_parameters:
- name: HOST_NAME
  type: metadata
  metadataProvider:
    environment: azure
    type: compute
    field: name
- name: BIGIP_PASSWORD
  type: url
  query: vmId
  value: http://169.254.169.254/metadata/instance/compute?api-version=2017-08-01
  headers:
  - name: Metadata
    value: true
- name: SELF_IP_EXTERNAL
  type: metadata
  metadataProvider:
    environment: azure
    type: network
    field: ipv4
    index: 1
- name: SELF_IP_INTERNAL
  type: metadata
  metadataProvider:
    environment: azure
    type: network
    field: ipv4
    index: 2
- name: INTERNAL_GW
  type: metadata
  metadataProvider:
    environment: azure
    type: network
    field: ipv4
    index: 2
    ipcalc: first
- name: DEFAULT_GW
  type: metadata
  metadataProvider:
    environment: azure
    type: network
    field: ipv4
    index: 1
    ipcalc: first
- name: MGMT_GW
  type: metadata
  metadataProvider:
    environment: azure
    type: network
    field: ipv4
    index: 0
    ipcalc: first
bigip_ready_enabled: []
extension_packages:
  install_operations:
  - extensionType: do
    extensionVersion: 1.41.0
    extensionHash: 3044e7ea1c8d7e10f51ec14a895374a956b3cbe3251dd6916f4f97da65d0a8e6
extension_services:
  service_operations:
  - extensionType: do
    type: inline
    value:
      schemaVersion: 1.0.0
      class: Device
      async: true
      label: 3NIC BIG-IP with Runtime-Init
      Common:
        class: Tenant
        My_DbVariables:
          class: DbVariables
          provision.extramb: 2022
          config.allow.rfc3927: enable
          dhclient.mgmt: disable
          systemauth.disablerootlogin: true
          provision.tomcat.extramb: 256

        My_System:
          class: System
          hostname: "{{{ HOST_NAME }}}.local"
          cliInactivityTimeout: 1200
          consoleInactivityTimeout: 1200
          autoPhonehome: false
        My_Dns:
          class: DNS
          nameServers:
          - 168.63.129.16
        ##start-License##
        My_License:
          class: License
          licenseType: regKey
          regKey: AAAAA-BBBBB-CCCCC-DDDDD-EEEEEEE
        ##end-License##
        myHttpd:
          class: HTTPD
          authPamIdleTimeout: 900
          allow:
          - all
          sslCiphersuite:
          - ECDHE-RSA-AES128-GCM-SHA256
          - ECDHE-RSA-AES256-GCM-SHA384
          - ECDHE-ECDSA-AES128-GCM-SHA256
          - ECDHE-ECDSA-AES256-GCM-SHA384
          sslProtocol: "all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1"
        mySshd:
          class: SSHD
          allow:
          - all
          inactivityTimeout: 900
          MACS:
          - hmac-sha1
          ciphers:
          - aes128-ctr
          - aes192-ctr
          - aes256-ctr
          kexAlgorithms:
          - ecdh-sha2-nistp256
          - ecdh-sha2-nistp384
          - ecdh-sha2-nistp521
          - diffie-hellman-group14-sha1
          - diffie-hellman-group-exchange-sha256
        My_Ntp:
          class: NTP
          servers:
          - 0.pool.ntp.org
          timezone: TiME_ZONE
        My_Provisioning:
          class: Provision
          ltm: nominal
          asm: nominal
        kodiakf5:
          class: User
          userType: regular
          partitionAccess:
            all-partitions:
              role: admin
          password: PASSWD
          shell: bash

        snmpcommunity:
          class: SnmpCommunity
          name: kodiakadmin
          oid: .1
          access: ro
          source: all

        default:
          class: ManagementRoute
          gw: "{{{ MGMT_GW }}}"
          network: default
        dnsroute:
          class: ManagementRoute
          gw: "{{{ MGMT_GW }}}"
          network: 168.63.129.16/32
        azureMetadata:
          class: ManagementRoute
          gw: "{{{ MGMT_GW }}}"
          network: 169.254.169.254/32
        external:
          class: VLAN
          tag: 4094
          mtu: 1500
          interfaces:
          - name: '1.1'
            tagged: false
        external-self:
          class: SelfIp
          address: "{{{ SELF_IP_EXTERNAL }}}"
          vlan: external
          allowService: none
          trafficGroup: traffic-group-local-only
        internal:
          class: VLAN
          tag: 4093
          mtu: 1500
          interfaces:
          - name: '1.2'
            tagged: false
        internal-self:
          class: SelfIp
          address: "{{{ SELF_IP_INTERNAL }}}"
          vlan: internal
          allowService: default
          trafficGroup: traffic-group-local-only
        defaultRoute:
          class: Route
          gw: "{{{ DEFAULT_GW }}}"
          network: default
          mtu: 1500
        ipvlan-self:
          class: SelfIp
          address: IPVLAN_SELF_IP
          vlan: internal
          allowService: default
          trafficGroup: traffic-group-local-only
        IpvlanRoutePri_Poc:
          class: Route
          gw: "{{{ INTERNAL_GW }}}"
          network: PRI_IPVLANROUTE_POC
          mtu: 1500
        IpvlanRouteGeo_poc:
          class: Route
          gw: "{{{ INTERNAL_GW }}}"
          network: GEO_IPVLANROUTE_POC
          mtu: 1500
        IpvlanRoutePri_gw:
          class: Route
          gw: "{{{ INTERNAL_GW }}}"
          network: PRI_IPVLANROUTE_GW
          mtu: 1500
        IpvlanRouteGeo_gw:
          class: Route
          gw: "{{{ INTERNAL_GW }}}"
          network: GEO_IPVLANROUTE_GW
          mtu: 1500
post_onboard_enabled: []
